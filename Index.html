<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Library Media Pembelajaran</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 30px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0 0 10px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
    }

    .info {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .assets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .asset {
      background: white;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .asset img {
      max-width: 100%;
      height: 130px;
      object-fit: contain;
    }

    .asset-name {
      margin-top: 10px;
      font-size: 14px;
      word-break: break-word;
    }

    code {
      background: #eee;
      padding: 3px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>

<header>
  <h1>📚 Asset Library Media Pembelajaran</h1>
  <p>SMAN 20 Konawe Selatan</p>
</header>

<div class="container">

  <div class="info">
    <h2>Asset Library Aktif</h2>
    <p>
      Seluruh aset di repository ini dapat digunakan kembali
      untuk media pembelajaran interaktif.
    </p>

    <p>
      <strong>Base URL:</strong><br>
      <code id="baseUrl"></code>
    </p>
  </div>

  <div id="assets" class="assets"></div>

</div>

<script>

const baseUrl = window.location.origin + window.location.pathname;

document.getElementById("baseUrl").textContent = baseUrl;

const files = [
  "01_Buku.png",
  "01_Guru.png",
  "01_Menu_Utama.png",
  "01_Sekolah.png",
  "01_Sel_Hewan.png",
  "01_Semak.png",
  "02_Benar.png"
];

const container = document.getElementById("assets");

files.forEach(file => {

  const card = document.createElement("div");

  card.className = "asset";

  card.innerHTML = `
    <img src="${file}" alt="${file}">
    <div class="asset-name">${file}</div>
  `;

  container.appendChild(card);

});

</script>

</body>
</html>
